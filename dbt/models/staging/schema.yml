      - name: year
        description: "Findex observation year."
        data_tests:
          - not_null

      - name: series
        description: "Original Global Findex series code."
        data_tests:
          - not_null

      - name: indicator
        description: "Standardized indicator name."
        data_tests:
          - not_null

      - name: source
        description: "Original data source."
        data_tests:
          - not_null


